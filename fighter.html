<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>ODDBOUT Twitch Cup battle</title>
    <!-- Canvas text waits for these exact faces. Discover them before the engine executes. -->
    <link rel="preload" href="/fonts/Pretendard-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/Pretendard-Bold.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/BlackHanSans-Lettering.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      @font-face { font-family: "Pretendard"; src: url("/fonts/Pretendard-Regular.woff2") format("woff2"); font-weight: 400; font-display: block; }
      @font-face { font-family: "Pretendard"; src: url("/fonts/Pretendard-Bold.woff2") format("woff2"); font-weight: 700; font-display: block; }
      @font-face { font-family: "Black Han Sans"; src: url("/fonts/BlackHanSans-Lettering.woff2") format("woff2"); font-display: block; }
      html, body { margin: 0; width: 100%; height: 100%; background: #071923; overflow: hidden; }
      #game { width: 100%; height: 100%; }
      #boot-loading { position: fixed; inset: 0; display: grid; place-items: center; color: #fff; font: 16px Pretendard, sans-serif; }
    </style>
  </head>
  <body>
    <div id="boot-loading">Loading battle…</div>
    <div id="game"></div>
    <script type="module" src="/src/fighter.ts"></script>
  </body>
</html>
